name: Compilar e testar NUVORA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Preparar chave fixa de teste
        env:
          CHAVE: ${{ secrets.NUVORA_TESTE_CHAVE }}
        run: echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/teste.jks"
      - name: Compilar (teste, teste otimizada e versão final)
        env:
          NUVORA_TESTE_KEYSTORE: ${{ runner.temp }}/teste.jks
          NUVORA_TESTE_SENHA: ${{ secrets.NUVORA_TESTE_SENHA }}
        run: gradle testDebugUnitTest assembleDebug assembleOtimizada assembleRelease --stacktrace
      - name: Conferir assinatura do APK de teste (deve ser sempre a mesma)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "SHA-256|DN"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/otimizada/*.apk | grep -E "SHA-256|DN"
      - name: Apagar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/teste.jks"
      - name: Tamanho dos APKs e perfis de inicialização
        run: |
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/otimizada/ app/build/outputs/apk/release/
          echo "perfis de inicialização (baseline profile) dentro do APK otimizado:"
          unzip -l app/build/outputs/apk/otimizada/*.apk | grep -i "dexopt" || echo "(nenhum)"
      - uses: actions/upload-artifact@v7
        with:
          name: nuvora-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: nuvora-otimizada
          path: app/build/outputs/apk/otimizada/*.apk

  telas:
    name: Abrir no emulador (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: celular
            target: google_apis
            arch: x86_64
            profile: pixel_5
          - name: tablet
            target: google_apis
            arch: x86_64
            profile: pixel_c
          - name: tv
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nuvora-otimizada
          path: apk
      - name: Servir listas de teste para o emulador
        run: |
          python3 ci/listas.py
          nohup python3 ci/servidor.py > /dev/null 2>&1 &
          # Provedor com certificado de segurança inválido no https (443), mas que também atende em http (80).
          openssl req -x509 -newkey rsa:2048 -nodes -keyout chave.pem -out cert.pem -days 2 -subj "/CN=outro-site.invalido" 2> /dev/null
          sudo nohup python3 ci/servidor.py 80 > /dev/null 2>&1 &
          sudo nohup python3 ci/servidor.py 443 cert.pem chave.pem > /dev/null 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8000/teste.m3u | head -3 && curl -sf http://127.0.0.1/teste.m3u | head -1 && curl -skf https://127.0.0.1/teste.m3u | head -1
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/telas.sh ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: telas-${{ matrix.name }}
          path: out/

  login:
    name: Login com provedor (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: celular
            target: google_apis
            arch: x86_64
            profile: pixel_5
          - name: tv
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nuvora-otimizada
          path: apk
      - name: Servidor que imita o provedor real (com vídeo local)
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          mkdir -p video
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 120             -c:v libx264 -preset veryfast -b:v 2000k -g 60 -c:a aac -b:a 128k             -f hls -hls_time 4 -hls_playlist_type vod -hls_segment_filename video/seg%03d.ts -hls_base_url /video/ video/canal.m3u8
          python3 ci/listas.py
          nohup python3 ci/provedor_intermediario.py 8900 video > intermediario.log 2>&1 &
          sleep 3
          # Confere que responde igual ao provedor real com dados errados.
          curl -s -o /dev/null -w "player_api sem dados: %{http_code}
" http://127.0.0.1:8900/player_api.php
          curl -s -o /dev/null -w "player_api dados errados: %{http_code}
" "http://127.0.0.1:8900/player_api.php?username=x&password=y"
          curl -s -o /dev/null -w "get.php dados errados: %{http_code}
" "http://127.0.0.1:8900/get.php?username=x&password=y&type=m3u_plus"
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/login.sh ${{ matrix.name }} "$(ls apk/*.apk)"
      - name: Resultado
        if: always()
        run: |
          cp intermediario.log out/ 2> /dev/null || true
          cat out/${{ matrix.name }}-login-passos.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: login-${{ matrix.name }}
          path: out/

  medicoes:
    name: Medir antes e depois a 8 Mega (${{ matrix.name }})
    needs: build
    # Só quando pedido à mão (economiza tempo de máquina nas etapas que não mexem em velocidade).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: celular
            target: google_apis
            arch: x86_64
            profile: pixel_5
          - name: tv
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nuvora-debug
          path: apk-antes
      - uses: actions/download-artifact@v8
        with:
          name: nuvora-otimizada
          path: apk-depois
      - name: Vídeos de teste locais e provedor grande com internet de 8 Mega
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          mkdir -p video
          # Canal ao vivo: HLS 720p de 2 Mbit/s (segmentos de 4 s). Filme: MP4 720p de 2 Mbit/s.
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 120             -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k -g 60 -c:a aac -b:a 128k             -f hls -hls_time 4 -hls_playlist_type vod -hls_segment_filename video/seg%03d.ts -hls_base_url /video/ video/canal.m3u8
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=330:sample_rate=48000 -t 120             -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k -g 60 -c:a aac -b:a 128k -movflags +faststart video/filme.mp4
          ls -la video | head
          python3 ci/listas.py
          nohup python3 ci/provedor_grande.py 8800 video > provedor.log 2>&1 &
          sleep 25; cat provedor.log
          # Confere o limite: 5 MB devem levar ~5 s.
          inicio=$(date +%s.%N); curl -s "http://127.0.0.1:8800/player_api.php?username=grande&password=1234&action=get_live_streams" -o /tmp/l.json
          python3 -c "import os,sys; t=float(sys.argv[2])-float(sys.argv[1]); b=os.path.getsize('/tmp/l.json'); print(f'teste do limite: {b/1e6:.1f} MB em {t:.1f} s = {b*8/t/1e6:.1f} Mbit/s')" "$inicio" "$(date +%s.%N)" | tee -a provedor.log
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash ci/medir.sh ${{ matrix.name }} "$(ls apk-antes/*.apk)" antes
            bash ci/medir.sh ${{ matrix.name }} "$(ls apk-depois/*.apk)" depois
      - name: Resultado
        if: always()
        run: |
          cp provedor.log out/ 2> /dev/null || true
          paste -d'	' out/medidas-${{ matrix.name }}-antes.txt out/medidas-${{ matrix.name }}-depois.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: medicoes-${{ matrix.name }}
          path: out/
