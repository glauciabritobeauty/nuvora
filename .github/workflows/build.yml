name: Compilar e testar NUVORA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Preparar chave fixa de teste
        env:
          CHAVE: ${{ secrets.NUVORA_TESTE_CHAVE }}
        run: echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/teste.jks"
      - name: Compilar (teste e versão final otimizada)
        env:
          NUVORA_TESTE_KEYSTORE: ${{ runner.temp }}/teste.jks
          NUVORA_TESTE_SENHA: ${{ secrets.NUVORA_TESTE_SENHA }}
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Conferir assinatura do APK de teste (deve ser sempre a mesma)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "SHA-256|DN"
      - name: Apagar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/teste.jks"
      - name: Tamanho dos APKs
        run: ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v7
        with:
          name: nuvora-debug
          path: app/build/outputs/apk/debug/*.apk

  telas:
    name: Abrir no emulador (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: celular
            target: google_apis
            arch: x86_64
            profile: pixel_5
          - name: tablet
            target: google_apis
            arch: x86_64
            profile: pixel_c
          - name: tv
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nuvora-debug
          path: apk
      - name: Habilitar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/telas.sh ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: telas-${{ matrix.name }}
          path: out/
